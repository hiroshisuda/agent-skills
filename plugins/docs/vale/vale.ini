# Vale config for the docs plugin's PostToolUse hook. The hook copies this
# file into the plugin's data directory and runs `vale sync` there whenever
# it changes, so StylesPath resolves next to the copy, not in the plugin.
# To take a new vale-ai-tells release, change the version in the URL.
StylesPath = styles
MinAlertLevel = suggestion

Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

[*.md]
BasedOnStyles = ai-tells
